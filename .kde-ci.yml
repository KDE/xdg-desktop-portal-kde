    'require':
      'frameworks/extra-cmake-modules': 'Frameworks/6.24'
      'frameworks/kauth': 'Frameworks/6.24'
      'frameworks/kcodecs': 'Frameworks/6.24'
      'frameworks/kcompletion': 'Frameworks/6.24'
      'frameworks/kconfig': 'Frameworks/6.24'
      'frameworks/kconfigwidgets': 'Frameworks/6.24'
      'frameworks/kcoreaddons': 'Frameworks/6.24'
      'frameworks/ki18n': 'Frameworks/6.24'
      'frameworks/kio': 'Frameworks/6.24'
      'frameworks/kitemviews': 'Frameworks/6.24'
      'frameworks/kjobwidgets': 'Frameworks/6.24'
      'frameworks/knotifications': 'Frameworks/6.24'
      'frameworks/kservice': 'Frameworks/6.24'
      'frameworks/kwidgetsaddons': 'Frameworks/6.24'
      'frameworks/kwindowsystem': 'Frameworks/6.24'
      'frameworks/kxmlgui': 'Frameworks/6.24'
      'frameworks/solid': 'Frameworks/6.24'
      'frameworks/kirigami': 'Frameworks/6.24'
      'frameworks/kstatusnotifieritem': 'Frameworks/6.24'
      'frameworks/kcrash': 'Frameworks/6.24'
